
embedder:
  default_provider: ollama
  default_model: nomic-embed-text

  models:
    nomic-embed-text:
      dim: 768
      document_prefix: "search_document: "
      query_prefix: "search_query: "
    bge-m3:
      dim: 1024

  providers:
    ollama:
      models:
        nomic-embed-text: nomic-embed-text
        bge-m3: bge-m3
    # sentence_transformers:
    #   models:
    #     nomic-embed-text: nomic-ai/nomic-embed-text-v1.5
    #     bge-m3: BAAI/bge-m3

llm:
  provider: ollama
  model: qwen2.5:7b

logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    standard:
      format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: standard
      level: DEBUG
  loggers:
    paper_rag:
      level: DEBUG
      handlers: [console]
      propagate: false
    django:
      level: INFO
      handlers: [console]
      propagate: false
    httpx:
      level: WARNING

  root:
    level: WARNING
    handlers: [console]


sources:
  inspire:
    url: https://inspirehep.net/literature/
    api_url: https://inspirehep.net/api/literature
    fields:
      - control_number
      - titles
      - abstracts
      - authors.full_name
      - earliest_date
    max_results: 10000
    page_size: 100
    delay: 1.0
    sort: mostrecent

text:
  cleaners:
    default_cleaning_pipeline: # order matter
      - whitelisted_strip_markup
      - normalize_whitespace
    mathml_tags: [
      "math", "mrow", "mi", "mo", "msup", "mn", "msub",
      "msubsup", "mfrac", "mstyle", "mtext", "mspace",
      "sup", "mover", "msqrt",
    ]
