[tool.poetry]
name = "paper-rag"
version = "0.1.0"
readme = "README.md"
packages = [{include = "paper_rag", from = "src"}]


[tool.poetry.dependencies]
python = "^3.12"
dotenv = "^0.9.9"
pyyaml = "^6.0.3"
httpx = "^0.28.1"
django = "^6.1.1"
pgvector = "^0.5.0"
psycopg2 = "^2.9.13"

[tool.setuptools.packages.find]
where = ["src"]
[dependency-groups]
dev = [
    "django-stubs (>=6.1.1,<7.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-env (>=1.7.1,<2.0.0)"
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "paper_rag.settings"